<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <style>
    .edge { stroke: #18181b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .edge-faint { stroke: #18181b; stroke-width: 2.2; stroke-opacity: 0.5; stroke-linecap: round; stroke-linejoin: round; }
    .edge-mid { stroke: #18181b; stroke-width: 2.2; stroke-opacity: 0.7; stroke-linecap: round; stroke-linejoin: round; }
    .node { fill: #18181b; }
    @media (prefers-color-scheme: dark) {
      .edge { stroke: #f4f4f5; }
      .edge-faint { stroke: #f4f4f5; }
      .edge-mid { stroke: #f4f4f5; }
      .node { fill: #f4f4f5; }
    }
  </style>

  <!-- Inner circular counter / AST core -->
  <circle cx="54" cy="42" r="13" class="edge" />

  <!-- Outer stem and structural trusses -->
  <line x1="26" y1="26" x2="26" y2="76" class="edge" />
  <line x1="26" y1="26" x2="38" y2="66" class="edge" />
  <line x1="26" y1="76" x2="38" y2="66" class="edge" />
  <line x1="38" y1="66" x2="38" y2="26" class="edge" />
  <line x1="26" y1="26" x2="38" y2="26" class="edge" />

  <!-- Loop outer boundary segments -->
  <line x1="38" y1="26" x2="54" y2="18" class="edge" />
  <path d="M 54 18 A 24 24 0 0 1 78 42 A 24 24 0 0 1 54 66" class="edge" fill="none" />
  <line x1="54" y1="66" x2="38" y2="66" class="edge" />

  <!-- Interconnecting dependency edges across loop -->
  <line x1="38" y1="26" x2="71" y2="26" class="edge-faint" />
  <line x1="54" y1="18" x2="71" y2="58" class="edge-mid" />
  <line x1="71" y1="26" x2="54" y2="66" class="edge-mid" />
  <line x1="78" y1="42" x2="41" y2="42" class="edge-mid" />
  <line x1="71" y1="58" x2="38" y2="66" class="edge" />

  <!-- Vertices / AST Graph Nodes -->
  <circle cx="26" cy="26" r="3.5" class="node" />
  <circle cx="26" cy="76" r="3.5" class="node" />
  <circle cx="54" cy="18" r="3.5" class="node" />
  <circle cx="71" cy="26" r="3" class="node" />
  <circle cx="78" cy="42" r="3.5" class="node" />
  <circle cx="71" cy="58" r="3" class="node" />
  <circle cx="54" cy="66" r="3.5" class="node" />
</svg>
